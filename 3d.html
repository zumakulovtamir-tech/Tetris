<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Куб с управлением</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; }
        canvas { display: block; }
    </style>
</head>
<body>

    <!-- Подключаем Three.js и его модули -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        // Импортируем контроллер камеры
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- НОВОЕ: ДОБАВЛЯЕМ УПРАВЛЕНИЕ ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Добавляет плавность (инерцию) при вращении
        controls.dampingFactor = 0.05;
        controls.enableZoom = true; // Разрешаем приближать/отдалять

        const geometry = new THREE.BoxGeometry(1.5, 1.5, 1.5); 
        const material = new THREE.MeshStandardMaterial({ 
            color: 0x00ffcc, 
            wireframe: true,
            emissive: 0x005544 
        }); 
        
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        const light = new THREE.DirectionalLight(0xffffff, 2);
        light.position.set(2, 2, 5);
        scene.add(light);

        const ambientLight = new THREE.AmbientLight(0x404040); 
        scene.add(ambientLight);

        function animate() {
            requestAnimationFrame(animate);

            // Автоматическое вращение куба (можно убрать или замедлить, если хочешь)
            cube.rotation.x += 0.005;
            cube.rotation.y += 0.005;

            // --- НОВОЕ: Обновляем контроллер каждый кадр ---
            controls.update(); 

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
